<style>
  :root{
    --bg:#FAFAF8;
    --surface:#FFFFFF;
    --surface-alt:#F3F2EF;
    --ink:#1C1C1E;
    --ink-soft:#6B6B70;
    --ink-faint:#B5B5B9;
    --line:#948F84;
    --accent:#2F3C7E;
    --accent-soft:#E9EBF6;
    --tension:#8C6410;
    --tension-soft:#F6EEDC;
    --danger:#B3402A;
    --danger-soft:#F7E8E4;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font-family:inherit;}
  #app{
    max-width:900px;
    margin:0 auto;
    min-height:100%;
    padding-bottom:calc(160px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  header.app-header{
    padding:18px 18px 10px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  .app-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  header.app-header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:0.02em;}
  header.app-header p{margin:3px 0 0;font-size:12.5px;color:var(--ink-soft);}

  main.content{padding:4px 16px 20px;}

  /* ---------- Filter row ---------- */
  .filter-row{display:flex;gap:8px;align-items:center;margin:8px 0 10px;}
  .filter-row select{flex:1;}
  .icon-btn{
    appearance:none;border:none;background:var(--surface-alt);
    width:44px;height:44px;border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);cursor:pointer;flex:none;
  }
  .icon-btn.active{background:var(--accent-soft);color:var(--accent);}

  /* ---------- Category panel ---------- */
  .category-panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    margin-bottom:16px;
  }
  .category-panel[hidden]{display:none;}
  .category-row{
    display:flex;align-items:center;gap:8px;
    background:var(--surface-alt);
    border-radius:var(--radius-sm);
    padding:8px 8px 8px 12px;
    margin-bottom:8px;
  }
  .category-row .cat-name{flex:1;font-size:14px;font-weight:600;}
  .category-row.editing .cat-name{display:none;}
  .category-row input.cat-edit-input{
    flex:1;display:none;border:1px solid var(--accent);border-radius:8px;
    padding:8px 10px;font-size:14px;
  }
  .category-row.editing input.cat-edit-input{display:block;}
  .cat-abbr-badge{
    flex:none;font-size:11px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border-radius:100px;padding:3px 9px;
  }
  .cat-abbr-badge.empty{color:var(--ink-faint);background:transparent;border:1px dashed var(--line);}
  .category-row.editing .cat-abbr-badge{display:none;}
  .category-row input.cat-abbr-input{
    display:none;width:56px;flex:none;border:1px solid var(--accent);border-radius:8px;
    padding:8px 8px;font-size:14px;text-align:center;
  }
  .category-row.editing input.cat-abbr-input{display:block;}
  .category-row .icon-btn{width:34px;height:34px;background:var(--surface);}
  .add-category-row{display:flex;gap:8px;margin-top:4px;}
  .add-category-row input{flex:1;}
  .add-category-row #new-category-abbr-input{flex:none;width:72px;text-align:center;}

  /* ---------- Settings page ---------- */
  #settings-view{padding-top:8px;}
  .settings-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 2px;
  }
  .settings-row + .settings-row{border-top:1px solid var(--line);}
  .settings-title{font-size:14px;font-weight:700;}
  .settings-desc{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- Buttons ---------- */
  .btn{
    appearance:none;border:none;border-radius:var(--radius-sm);
    padding:11px 16px;font-size:14.5px;font-weight:600;cursor:pointer;
    min-height:44px;display:inline-flex;align-items:center;justify-content:center;
    gap:6px;line-height:1;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:var(--surface-alt);color:var(--ink);}
  .btn-ghost{background:none;border:none;color:var(--accent);font-size:13.5px;font-weight:700;cursor:pointer;padding:6px 4px;min-height:auto;}
  .btn-danger-ghost{background:none;border:none;color:var(--danger);font-size:13.5px;font-weight:700;cursor:pointer;padding:6px 4px;min-height:auto;}
  .btn-block{width:100%;}

  /* ---------- Empty state ---------- */
  .empty-state{
    border:1.5px dashed var(--line);border-radius:var(--radius);
    padding:30px 16px;text-align:center;color:var(--ink-soft);
    font-size:13.5px;line-height:1.7;
  }

  /* ---------- Phrase rows ---------- */
  .phrase-row{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .phrase-row-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;
    cursor:pointer;
  }
  .row-label{display:flex;align-items:center;min-width:0;flex:1;}
  .row-num{font-size:14px;font-weight:700;color:var(--accent);flex:none;}
  .row-bar{color:var(--line);flex:none;margin:0 7px 0 1px;}
  .row-label .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .phrase-row-head .name{font-size:15px;font-weight:700;color:var(--ink);}
  .phrase-row-head .name.placeholder{color:var(--ink-faint);font-weight:600;}
  .chevron{color:var(--ink-faint);font-size:12px;transition:transform .15s ease;flex:none;margin-left:8px;}
  .phrase-row.open .chevron{transform:rotate(180deg);}
  .phrase-expanded{padding:0 16px 16px;}
  .expanded-meta{margin-bottom:10px;}
  .category-tag{
    display:inline-flex;background:var(--accent-soft);color:var(--accent);
    font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;
  }
  .degree-line{font-size:13px;color:var(--ink-soft);margin:10px 2px 0;line-height:1.6;}
  .degree-line b{color:var(--ink);font-weight:700;}
  .degree-line .arrow{color:var(--ink-faint);margin:0 4px;}
  .expanded-actions{display:flex;gap:14px;margin-top:12px;}

  /* ---------- Edit fields ---------- */
  .field{margin-bottom:12px;}
  .field-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;display:block;}
  .input{
    width:100%;border:1px solid var(--line);background:var(--surface);
    border-radius:var(--radius-sm);padding:11px 12px;font-size:15px;
    color:var(--ink);min-height:44px;
  }
  .approach-toggle-row{margin:4px 0 14px;}

  /* ---------- Mini grid (relative rows) ---------- */
  .mini-grid-wrap{
    display:flex;border:1px solid var(--line);border-radius:var(--radius-sm);
    overflow:hidden;background:var(--surface-alt);
  }
  .mini-grid-wrap.grid-dragging{overflow:visible;}
  .mini-grid-col{
    display:flex;flex-direction:column;flex:1;min-width:0;position:relative;
  }
  .mini-grid-col.approach{background:rgba(0,0,0,0.025);}
  .mini-grid-col + .mini-grid-col{border-left:1px solid var(--line);}
  .mini-grid-col.main-start{border-left:2px solid var(--ink-faint);}
  .mini-grid-cell{
    height:34px;border-bottom:1px solid rgba(0,0,0,0.12);
    position:relative;
  }
  .mini-grid-cell.filled.triad{background:var(--accent);}
  .mini-grid-cell.filled.tension{background:var(--tension);}
  .mini-grid-cell.editable-cell{cursor:pointer;}
  .mini-grid-cell.editable-cell:active{background:rgba(47,60,126,0.06);}
  .mini-grid-label{
    position:absolute;inset:0;
    font-size:11px;font-weight:700;color:#fff;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .mini-grid-cell.drag-preview{outline:2px solid var(--accent);outline-offset:-2px;}
  .mini-grid-col.dragging-col{background:rgba(47,60,126,0.04);}
  .mini-grid-cell.dragging-cell{
    box-shadow:0 8px 16px rgba(0,0,0,0.28);
    border-radius:6px;
    z-index:10;
  }

  /* ---------- Bottom sheet (degree picker) ---------- */
  .sheet-overlay{
    position:fixed;inset:0;background:rgba(20,20,22,0.4);z-index:30;
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .sheet-overlay.show{opacity:1;pointer-events:auto;}
  .sheet-panel{
    position:fixed;left:0;right:0;bottom:0;max-width:900px;margin:0 auto;
    background:var(--surface);border-radius:18px 18px 0 0;
    padding:14px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .22s ease;z-index:31;
  }
  .sheet-overlay.show .sheet-panel{transform:translateY(0);}
  .sheet-grabber{width:36px;height:4px;background:var(--line);border-radius:4px;margin:2px auto 14px;}
  .sheet-title{font-size:13.5px;font-weight:700;color:var(--ink-soft);margin-bottom:12px;}
  .degree-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .degree-btn{
    appearance:none;border:1.5px solid var(--line);background:var(--surface);
    border-radius:10px;padding:12px 0;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .degree-btn.triad{border-color:var(--accent);color:var(--accent);}
  .degree-btn.tension{border-color:var(--tension);color:var(--tension);}
  .degree-btn.triad:active{background:var(--accent-soft);}
  .degree-btn.tension:active{background:var(--tension-soft);}
  .sheet-footer{display:flex;gap:8px;}

  /* ---------- Modal (custom confirm) ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,20,22,0.4);z-index:40;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--surface);border-radius:16px;padding:20px;max-width:340px;width:100%;}
  .modal-box p{font-size:14px;line-height:1.7;margin:0 0 18px;color:var(--ink);}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}

  /* ---------- Fretboard ---------- */
  .fretboard-section{margin-top:14px;}
  .fretboard-diagram{
    background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:10px 6px;overflow-x:auto;
  }
  .fretboard-diagram svg{display:block;}
  .fretboard-diagram .fb-note{cursor:pointer;}
  .fb-unplaced-list{margin-top:8px;}
  .fb-unplaced-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 4px;font-size:13px;color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
  .fret-candidate-list{
    max-height:50vh;overflow-y:auto;
    display:flex;flex-direction:column;gap:8px;margin-bottom:14px;
  }
  .fret-candidate-btn{
    appearance:none;border:1.5px solid var(--line);background:var(--surface);
    border-radius:10px;padding:12px 14px;font-size:14.5px;font-weight:600;
    color:var(--ink);text-align:left;cursor:pointer;
  }
  .fret-candidate-btn:active{background:var(--accent-soft);border-color:var(--accent);}
  .fb-pattern-switcher{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .fb-pattern-btn{
    appearance:none;border:1.5px solid var(--line);background:var(--surface);
    border-radius:100px;padding:7px 14px;font-size:12.5px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;
  }
  .fb-pattern-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}

  /* ---------- Links (連結) ---------- */
  .link-selected-row, .link-add-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:8px;font-size:13.5px;
  }
  .link-selected-actions{display:flex;gap:4px;flex:none;}
  .link-selected-actions .icon-btn{width:30px;height:30px;background:var(--surface-alt);}
  .link-badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .link-badge{
    appearance:none;border:1.5px solid var(--accent);background:var(--accent-soft);
    color:var(--accent);border-radius:8px;padding:8px 12px;
    font-size:13px;font-weight:700;cursor:pointer;
  }
  .link-badge.missing{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);}
  .link-detail-box{
    background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;margin-bottom:14px;
  }
  .link-detail-box .degree-line-title{font-size:13.5px;font-weight:700;margin-bottom:8px;}


  /* ---------- Tab bar ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;
    height:calc(60px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--surface);border-top:1px solid var(--line);
    display:flex;max-width:900px;margin:0 auto;z-index:15;
  }
  .tabbar[hidden]{display:none;}
  .tabbar .tab-btn{
    flex:1;appearance:none;border:none;background:none;
    font-size:13.5px;font-weight:700;color:var(--ink-faint);cursor:pointer;
  }
  .tabbar .tab-btn.active{color:var(--accent);}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    right:max(20px, calc((100vw - 900px) / 2 + 20px));
    bottom:calc(60px + 22px + env(safe-area-inset-bottom));
    width:56px;height:56px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;
    font-size:26px;font-weight:400;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(47,60,126,0.35);
    cursor:pointer;z-index:20;
  }
  .fab:active{background:#26305F;}
</style>
</head>

<script>
(function(){
  "use strict";

  /* =========================================================
     度数テーブル（半音0〜11 とラベルの対応）
  ========================================================= */
  var DEGREES = [
    {label:'R',   semitone:0,  type:'triad'},
    {label:'b9',  semitone:1,  type:'tension'},
    {label:'9',   semitone:2,  type:'tension'},
    {label:'#9',  semitone:3,  type:'tension'},
    {label:'m3',  semitone:3,  type:'triad'},
    {label:'3',   semitone:4,  type:'triad'},
    {label:'11',  semitone:5,  type:'tension'},
    {label:'#11', semitone:6,  type:'tension'},
    {label:'5',   semitone:7,  type:'triad'},
    {label:'b13', semitone:8,  type:'tension'},
    {label:'13',  semitone:9,  type:'tension'},
    {label:'m7',  semitone:10, type:'triad'},
    {label:'7',   semitone:11, type:'triad'}
  ];
  function degreeInfo(label){
    for (var i=0;i<DEGREES.length;i++){ if (DEGREES[i].label===label) return DEGREES[i]; }
    return null;
  }

  /* =========================================================
     指板パターン生成
     弦の開放弦の高さ（movable shapeなので度数R=0を基準にした相対値）
     STRING_OPEN[0]=1弦(高いE・上段) 〜 STRING_OPEN[5]=6弦(低いE・下段)
  ========================================================= */
  var STRING_OPEN = [64,59,55,50,45,40];
  var STRING_LABELS = ['1弦','2弦','3弦','4弦','5弦','6弦'];
  var FRET_MAX = 15;

  function fbFindStartFret(stringIdx, targetSemitone){
    var open = STRING_OPEN[stringIdx];
    for (var f=0; f<=FRET_MAX; f++){
      if ((open+f) % 12 === targetSemitone) return f;
    }
    return 0;
  }

  function fbSearchNear(lastPos, targetSemitone, direction){
    var lastAbs = STRING_OPEN[lastPos.string] + lastPos.fret;
    var lo = Math.max(0, lastPos.fret-3);
    var hi = Math.min(FRET_MAX, lastPos.fret+3);
    var candidates = [];
    for (var s=0; s<6; s++){
      for (var f=lo; f<=hi; f++){
        if ((STRING_OPEN[s]+f) % 12 === targetSemitone){
          var abs = STRING_OPEN[s]+f;
          var ok = direction==='up' ? abs>lastAbs : direction==='down' ? abs<lastAbs : true;
          if (ok) candidates.push({string:s, fret:f, dist:Math.abs(abs-lastAbs)});
        }
      }
    }
    if (!candidates.length) return null;
    candidates.sort(function(a,b){ return a.dist-b.dist; });
    return {string:candidates[0].string, fret:candidates[0].fret};
  }

  function fbAllCandidates(targetSemitone){
    var out = [];
    for (var s=0; s<6; s++){
      for (var f=0; f<=FRET_MAX; f++){
        if ((STRING_OPEN[s]+f) % 12 === targetSemitone) out.push({string:s, fret:f});
      }
    }
    return out;
  }

  function fbGenerate(seq, startString){
    var positions = [];
    var firstInfo = degreeInfo(seq[0].label);
    positions[0] = {string:startString, fret: fbFindStartFret(startString, firstInfo.semitone)};
    var lastValid = positions[0];
    for (var i=1; i<seq.length; i++){
      var direction = seq[i].row>seq[i-1].row ? 'up' : (seq[i].row<seq[i-1].row ? 'down' : 'any');
      var info = degreeInfo(seq[i].label);
      var found = fbSearchNear(lastValid, info.semitone, direction);
      positions[i] = found;
      if (found) lastValid = found;
    }
    return positions;
  }

  function fbScore(positions){
    var nullCount = 0, frets = [];
    positions.forEach(function(p){ if (!p) nullCount++; else frets.push(p.fret); });
    var span = frets.length ? (Math.max.apply(null,frets)-Math.min.apply(null,frets)) : 0;
    return {nullCount:nullCount, span:span};
  }

  function fbGenerateAll(seq){
    var results = [];
    for (var s=0; s<6; s++){
      var positions = fbGenerate(seq, s);
      results.push({startString:s, positions:positions, score:fbScore(positions)});
    }
    var complete = results.filter(function(r){ return r.score.nullCount===0; });
    var pool = complete.length>0 ? complete : results;
    pool.sort(function(a,b){
      if (a.score.nullCount!==b.score.nullCount) return a.score.nullCount-b.score.nullCount;
      return a.score.span-b.score.span;
    });
    return pool;
  }

  function buildFretSequence(approach, main){
    var seq = [];
    if (approach){ approach.forEach(function(n){ if (n) seq.push({label:n.label, row:n.row}); }); }
    main.forEach(function(n){ if (n) seq.push({label:n.label, row:n.row}); });
    return seq;
  }

  var APPROACH_TIMES = ['3拍表','3拍裏','4拍表','4拍裏'];
  var MAIN_TIMES = ['1拍表','1拍裏','2拍表','2拍裏'];

  var ICON_EDIT = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
  var ICON_CONFIRM = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

  /* =========================================================
     状態管理 / 保存（この端末内・仮保存）
  ========================================================= */
  var STORAGE_KEY = 'phraseStockData_v3';
  var state = loadState();

  function loadState(){
    var s = null;
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        if (parsed && parsed.categories && parsed.phrases) s = parsed;
      }
    }catch(e){}
    if (!s) s = { categories: ['未分類'], phrases: [] };
    if (!s.categoryAbbr) s.categoryAbbr = {};
    if (!s.links) s.links = [];
    return s;
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function ensureUncategorizedLast(){
    var idx = state.categories.indexOf('未分類');
    if (idx!==-1 && idx!==state.categories.length-1){
      state.categories.splice(idx,1);
      state.categories.push('未分類');
    }
  }
  ensureUncategorizedLast();

  function getPhraseNumberInfo(phrase){
    if (!phrase || phrase.category==='未分類') return null;
    var abbr = state.categoryAbbr[phrase.category];
    if (!abbr) return null;
    var siblings = state.phrases
      .filter(function(p){ return p.category===phrase.category; })
      .sort(function(a,b){ return a.createdAt-b.createdAt; });
    var idx = siblings.findIndex(function(p){ return p.id===phrase.id; });
    if (idx===-1) return null;
    return { abbr: abbr, num: idx+1 };
  }
  function getPhraseNumberLabel(phrase){
    var info = getPhraseNumberInfo(phrase);
    return info ? (info.abbr + info.num) : null;
  }
  function getPhraseListNumberText(phrase){
    var info = getPhraseNumberInfo(phrase);
    if (!info) return '';
    return (ui.filterCategory==='ALL') ? (info.abbr + info.num) : String(info.num);
  }
  function eligiblePhrasesForLink(){
    return state.phrases.filter(function(p){ return !!getPhraseNumberLabel(p); });
  }
  function findCategoryWithAbbr(abbr, excludeName){
    return Object.keys(state.categoryAbbr).find(function(catName){
      return catName!==excludeName && state.categoryAbbr[catName]===abbr;
    });
  }

  /* =========================================================
     UI状態
  ========================================================= */
  var ui = {
    filterCategory: 'ALL',   // 'ALL' または カテゴリ名
    expandedId: null,        // フレーズid か 'NEW' か null
    mode: null,              // 'view' | 'edit'
    draft: null,             // 編集中の作業コピー
    categoryPanelOpen: false,
    fingeringSession: null,  // 運指パターンの作成・編集セッション {phraseId, editingId, seq, results, index, name}
    linksSubView: 'list',    // 'list' | 'create' | 'detail'
    linksActiveId: null,     // 表示中の連結id
    linksDraft: null,        // 作成・編集中の作業コピー {id, name, phraseIds}
    linksDetailExpanded: null // 詳細画面で開いているフレーズのindex
  };
  var pickerTarget = null; // {group:'main'|'approach', index:0-3}

  /* =========================================================
     ユーティリティ
  ========================================================= */
  function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
  function uid(){ return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }
  function makeEl(tag, className, text){
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text!==undefined && text!==null) e.textContent = text;
    return e;
  }
  function cloneNote(n){ return n ? {label:n.label, row:n.row}: null; }

  /* =========================================================
     4マスの拍グリッド（各拍＝縦4マスの列。マスの位置がそのまま高さになる）
     同じセクション(アプローチ／メインそれぞれ)内で、同じ高さは1拍にしか使えない
  ========================================================= */
  var GRID_ROWS = 4;

  function findNoteWithRow(arr, row, excludeIndex){
    if (!arr) return null;
    for (var i=0;i<arr.length;i++){
      if (i===excludeIndex) continue;
      if (arr[i] && arr[i].row===row) return {index:i, note:arr[i]};
    }
    return null;
  }
  function findFreeRow(arr, excludeIndex){
    var used = [];
    arr.forEach(function(n,i){ if (i!==excludeIndex && n) used.push(n.row); });
    for (var r=0;r<GRID_ROWS;r++){
      if (used.indexOf(r)===-1) return r;
    }
    return 0;
  }

  function buildGrid(approachNotes, mainNotes, editable){
    var cols = [];
    if (approachNotes){
      approachNotes.forEach(function(n,i){ cols.push({note:n, group:'approach', index:i}); });
    }
    mainNotes.forEach(function(n,i){ cols.push({note:n, group:'main', index:i}); });

    var wrap = makeEl('div','mini-grid-wrap');

    cols.forEach(function(colInfo, idx){
      var col = makeEl('div','mini-grid-col' + (colInfo.group==='approach' ? ' approach' : ''));
      col.dataset.group = colInfo.group;
      col.dataset.index = colInfo.index;
      if (colInfo.group==='main' && idx>0 && cols[idx-1].group==='approach'){
        col.classList.add('main-start');
      }
      var note = colInfo.note;
      var info = note ? degreeInfo(note.label) : null;
      var sectionArr = (colInfo.group==='main') ? mainNotes : approachNotes;

      for (var r = GRID_ROWS-1; r>=0; r--){
        var cell = makeEl('div','mini-grid-cell');
        if (info && note.row===r){
          cell.classList.add('filled', info.type);
          cell.appendChild(makeEl('span','mini-grid-label', info.label));
          if (editable){
            attachFilledCellInteractions(cell, col, colInfo.group, colInfo.index, r);
          }
        } else if (!note && editable && !findNoteWithRow(sectionArr, r, colInfo.index)){
          cell.classList.add('editable-cell');
          (function(g,i,rr){
            cell.addEventListener('click', function(){ openPicker(g,i,rr); });
          })(colInfo.group, colInfo.index, r);
        }
        col.appendChild(cell);
      }
      wrap.appendChild(col);
    });
    return wrap;
  }

  function highlightDragRow(col, targetRow){
    var cells = col.querySelectorAll('.mini-grid-cell');
    cells.forEach(function(c, i){
      var thisRow = (GRID_ROWS-1) - i;
      c.classList.toggle('drag-preview', thisRow===targetRow);
    });
  }
  function clearDragRow(col){
    col.querySelectorAll('.mini-grid-cell.drag-preview').forEach(function(c){ c.classList.remove('drag-preview'); });
  }
  function rowFromPointerY(colRect, clientY){
    var ratio = (clientY - colRect.top) / colRect.height;
    ratio = Math.min(0.999, Math.max(0, ratio));
    var fromTop = Math.floor(ratio * GRID_ROWS);
    return (GRID_ROWS-1) - fromTop;
  }
  function hitTestColumn(wrap, clientX, groupFilter){
    var cols = wrap.querySelectorAll('.mini-grid-col[data-group="' + groupFilter + '"]');
    if (cols.length===0) return null;
    for (var i=0;i<cols.length;i++){
      var r = cols[i].getBoundingClientRect();
      if (clientX>=r.left && clientX<r.right) return cols[i];
    }
    var firstRect = cols[0].getBoundingClientRect();
    if (clientX < firstRect.left) return cols[0];
    return cols[cols.length-1];
  }

  function attachFilledCellInteractions(cell, col, group, index, currentRow){
    var wrap = null;
    var LONG_PRESS_MS = 380;
    var MOVE_CANCEL_PX = 8;
    var pressTimer = null;
    var dragging = false;
    var justDragged = false;
    var startX = 0, startY = 0;
    var highlightedCol = null;

    function clearTimer(){ if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; } }
    function setHighlightedCol(newCol){
      if (highlightedCol && highlightedCol!==newCol){
        clearDragRow(highlightedCol);
        highlightedCol.classList.remove('dragging-col');
      }
      newCol.classList.add('dragging-col');
      highlightedCol = newCol;
    }
    function endDrag(){
      if (dragging){
        dragging = false;
        cell.style.transform = '';
        cell.style.touchAction = '';
        cell.classList.remove('dragging-cell');
        if (highlightedCol){ clearDragRow(highlightedCol); highlightedCol.classList.remove('dragging-col'); }
        highlightedCol = null;
        if (wrap) wrap.classList.remove('grid-dragging');
      }
    }

    cell.addEventListener('pointerdown', function(e){
      if (e.pointerType==='mouse' && e.button!==0) return;
      startX = e.clientX; startY = e.clientY;
      clearTimer();
      pressTimer = setTimeout(function(){
        wrap = col.parentElement;
        if (!wrap) return;
        dragging = true;
        cell.style.touchAction = 'none';
        cell.style.transform = 'scale(1.06)';
        cell.classList.add('dragging-cell');
        wrap.classList.add('grid-dragging');
        setHighlightedCol(col);
        highlightDragRow(col, currentRow);
        try{ cell.setPointerCapture(e.pointerId); }catch(err){}
      }, LONG_PRESS_MS);
    });
    cell.addEventListener('pointermove', function(e){
      if (!dragging){
        if (pressTimer && (Math.abs(e.clientX-startX)>MOVE_CANCEL_PX || Math.abs(e.clientY-startY)>MOVE_CANCEL_PX)){
          clearTimer();
        }
        return;
      }
      e.preventDefault();
      var deltaX = e.clientX - startX;
      var deltaY = e.clientY - startY;
      cell.style.transform = 'translate(' + deltaX + 'px, ' + deltaY + 'px) scale(1.06)';

      var targetCol = hitTestColumn(wrap, e.clientX, group) || col;
      setHighlightedCol(targetCol);
      highlightDragRow(targetCol, rowFromPointerY(targetCol.getBoundingClientRect(), e.clientY));
    });
    cell.addEventListener('pointerup', function(e){
      clearTimer();
      if (dragging){
        var targetCol = hitTestColumn(wrap, e.clientX, group) || col;
        var targetRow = rowFromPointerY(targetCol.getBoundingClientRect(), e.clientY);
        var targetGroup = targetCol.dataset.group;
        var targetIndex = parseInt(targetCol.dataset.index, 10);
        endDrag();
        justDragged = true;
        moveOrSwapNote(group, index, targetGroup, targetIndex, targetRow);
      }
    });
    cell.addEventListener('pointercancel', function(){ clearTimer(); endDrag(); });
    cell.addEventListener('click', function(){
      if (justDragged){ justDragged = false; return; }
      openPicker(group, index, currentRow);
    });
  }

  function moveOrSwapNote(fromGroup, fromIndex, toGroup, toIndex, toRow){
    if (!ui.draft) return;
    if (fromGroup!==toGroup) return; // アプローチとメインをまたぐ移動は不可
    var arr = (fromGroup==='main') ? ui.draft.main : ui.draft.approach;
    if (!arr) return;
    var draggedNote = arr[fromIndex];
    if (!draggedNote) return;

    if (fromIndex===toIndex){
      if (toRow===draggedNote.row) return;
      var selfSectionConflict = findNoteWithRow(arr, toRow, fromIndex);
      draggedNote.row = toRow;
      if (selfSectionConflict) selfSectionConflict.note.row = findFreeRow(arr, selfSectionConflict.index);
      renderPhraseList();
      return;
    }

    var targetNote = arr[toIndex];
    if (targetNote){
      // 入れ替え：拍(列)だけ交換し、それぞれの高さはそのまま(同じセクション内なので高さの重複は起きない)
      arr[fromIndex] = targetNote;
      arr[toIndex] = draggedNote;
    } else {
      arr[fromIndex] = null;
      var conflict = findNoteWithRow(arr, toRow, toIndex);
      draggedNote.row = toRow;
      arr[toIndex] = draggedNote;
      if (conflict) conflict.note.row = findFreeRow(arr, conflict.index);
    }
    renderPhraseList();
  }

  function degreeLineNode(approachNotes, mainNotes){
    var wrap = makeEl('div','degree-line');
    var hasAny = (approachNotes && approachNotes.some(Boolean)) || mainNotes.some(Boolean);
    if (!hasAny){ wrap.textContent = 'まだ音が選ばれていません'; return wrap; }
    if (approachNotes){
      wrap.appendChild(document.createTextNode(approachNotes.map(function(n){return n ? n.label : '―';}).join('-')));
      var arrow = makeEl('span','arrow','→');
      wrap.appendChild(arrow);
    }
    var b = makeEl('b', null, mainNotes.map(function(n){return n ? n.label : '―';}).join('-'));
    wrap.appendChild(b);
    return wrap;
  }

  /* =========================================================
     フレーズ一覧の描画
  ========================================================= */
  function filteredPhrases(){
    var list = ui.filterCategory==='ALL'
      ? state.phrases.slice()
      : state.phrases.filter(function(p){ return p.category===ui.filterCategory; });
    return list.sort(function(a,b){ return b.createdAt - a.createdAt; });
  }

  function renderHeaderCount(){
    var count = filteredPhrases().length;
    var label = ui.filterCategory==='ALL' ? ('全' + count + '件') : (ui.filterCategory + '：' + count + '件');
    document.getElementById('header-count').textContent = label;
  }

  function renderFilterSelect(){
    var sel = document.getElementById('category-filter-select');
    clear(sel);
    var allOpt = makeEl('option', null, 'すべて');
    allOpt.value = 'ALL';
    sel.appendChild(allOpt);
    state.categories.forEach(function(c){
      var opt = makeEl('option', null, c);
      opt.value = c;
      sel.appendChild(opt);
    });
    if (ui.filterCategory!=='ALL' && state.categories.indexOf(ui.filterCategory)===-1){
      ui.filterCategory = 'ALL';
    }
    sel.value = ui.filterCategory;
  }
  document.getElementById('category-filter-select').addEventListener('change', function(e){
    ui.filterCategory = e.target.value;
    renderHeaderCount();
    renderPhraseList();
  });

  function renderPhraseList(){
    var container = document.getElementById('phrase-list-container');
    clear(container);

    if (ui.expandedId==='NEW' && ui.draft){
      container.appendChild(buildEditRow(ui.draft, true));
    }

    var list = filteredPhrases();
    if (list.length===0 && ui.expandedId!=='NEW'){
      var msg = state.phrases.length===0
        ? '保存されたフレーズはまだありません。右下の「＋」から最初のフレーズを登録してください。'
        : 'このカテゴリにはフレーズがありません。';
      container.appendChild(makeEl('div','empty-state', msg));
      renderHeaderCount();
      return;
    }

    list.forEach(function(p){
      if (ui.expandedId===p.id){
        if (ui.mode==='edit' && ui.draft){
          container.appendChild(buildEditRow(ui.draft, false));
        } else {
          container.appendChild(buildViewRow(p));
        }
      } else {
        container.appendChild(buildCollapsedRow(p));
      }
    });
    renderHeaderCount();
  }

  function buildRowLabel(p){
    var wrap = makeEl('span','row-label');
    wrap.appendChild(makeEl('span','row-num', getPhraseListNumberText(p)));
    wrap.appendChild(makeEl('span','row-bar','｜'));
    wrap.appendChild(makeEl('span', p.name ? 'name' : 'name placeholder', p.name || '(名称未設定)'));
    return wrap;
  }

  function buildCollapsedRow(p){
    var row = makeEl('div','phrase-row');
    var head = makeEl('div','phrase-row-head');
    head.appendChild(buildRowLabel(p));
    var chev = makeEl('span','chevron','▾');
    head.appendChild(chev);
    head.addEventListener('click', function(){
      ui.expandedId = p.id;
      ui.mode = 'view';
      ui.draft = null;
      renderPhraseList();
    });
    row.appendChild(head);
    return row;
  }

  function buildViewRow(p){
    var row = makeEl('div','phrase-row open');
    var head = makeEl('div','phrase-row-head');
    head.appendChild(buildRowLabel(p));
    var chev = makeEl('span','chevron','▾');
    head.appendChild(chev);
    head.addEventListener('click', function(){
      ui.expandedId = null;
      ui.mode = null;
      renderPhraseList();
    });
    row.appendChild(head);

    var body = makeEl('div','phrase-expanded');
    var meta = makeEl('div','expanded-meta');
    meta.appendChild(makeEl('span','category-tag', p.category));
    body.appendChild(meta);

    body.appendChild(buildGrid(p.approach, p.main, false));
    body.appendChild(degreeLineNode(p.approach, p.main));

    var fb = buildFingeringViewBlock(p);

    var actions = makeEl('div','expanded-actions');
    var editBtn = makeEl('button','btn-ghost','編集');
    editBtn.addEventListener('click', function(e){
      e.stopPropagation();
      ui.draft = {
        id:p.id, name:p.name, category:p.category,
        main: p.main.map(cloneNote),
        approach: p.approach ? p.approach.map(cloneNote) : null
      };
      ui.mode = 'edit';
      renderPhraseList();
    });
    var exportBtn = makeEl('button','btn-ghost','書き出し');
    exportBtn.addEventListener('click', function(e){
      e.stopPropagation();
      exportPhraseData(p);
    });
    var delBtn = makeEl('button','btn-danger-ghost','削除');
    delBtn.addEventListener('click', function(e){
      e.stopPropagation();
      showConfirm('このフレーズを削除しますか？元に戻せません。', function(){
        state.phrases = state.phrases.filter(function(x){ return x.id!==p.id; });
        if (ui.fingeringSession && ui.fingeringSession.phraseId===p.id){ ui.fingeringSession = null; }
        saveState();
        ui.expandedId = null; ui.mode = null;
        renderFilterSelect();
        renderPhraseList();
      });
    });
    actions.appendChild(editBtn);
    actions.appendChild(exportBtn);
    actions.appendChild(delBtn);
    fb.button.style.marginLeft = 'auto';
    actions.appendChild(fb.button);
    body.appendChild(actions);
    body.appendChild(fb.section);

    row.appendChild(body);
    return row;
  }

  function buildEditRow(draft, isNew){
    var row = makeEl('div','phrase-row open');
    var head = makeEl('div','phrase-row-head');
    head.appendChild(makeEl('span','name', isNew ? '新規フレーズ' : (draft.name || '(名称未設定)')));
    row.appendChild(head);

    var body = makeEl('div','phrase-expanded');

    // フレーズ名
    var nameField = makeEl('div','field');
    nameField.appendChild(makeEl('label','field-label','フレーズ名'));
    var nameInput = document.createElement('input');
    nameInput.className = 'input';
    nameInput.value = draft.name || '';
    nameInput.addEventListener('input', function(e){ draft.name = e.target.value; });
    nameField.appendChild(nameInput);
    body.appendChild(nameField);

    // カテゴリ
    var catField = makeEl('div','field');
    catField.appendChild(makeEl('label','field-label','カテゴリ'));
    var catSelect = document.createElement('select');
    catSelect.className = 'input';
    state.categories.forEach(function(c){
      var opt = makeEl('option', null, c);
      opt.value = c;
      catSelect.appendChild(opt);
    });
    if (state.categories.indexOf(draft.category)===-1){
      draft.category = state.categories[0] || '未分類';
    }
    catSelect.value = draft.category;
    catSelect.addEventListener('change', function(e){ draft.category = e.target.value; });
    catField.appendChild(catSelect);
    body.appendChild(catField);

    // アプローチ切替
    var toggleRow = makeEl('div','approach-toggle-row');
    if (draft.approach){
      var removeBtn = makeEl('button','btn-danger-ghost','－ アプローチフレーズを削除');
      removeBtn.addEventListener('click', function(){
        showConfirm('アプローチフレーズを削除しますか？入力した内容は消えます。', function(){
          draft.approach = null;
          renderPhraseList();
        });
      });
      toggleRow.appendChild(removeBtn);
    } else {
      var addBtn = makeEl('button','btn-secondary btn-block','＋ アプローチフレーズを追加');
      addBtn.addEventListener('click', function(){
        draft.approach = [null,null,null,null];
        renderPhraseList();
      });
      toggleRow.appendChild(addBtn);
    }
    body.appendChild(toggleRow);

    // グリッド（編集可）
    body.appendChild(buildGrid(draft.approach, draft.main, true));

    // 運指パターン（保存済みフレーズのみ。新規作成中は非表示）
    if (!isNew){
      var fbToggleBtn = makeEl('button','btn btn-secondary','運指');
      var fbContainer = makeEl('div','fretboard-section');
      var fbOpen = !!(ui.fingeringSession && ui.fingeringSession.phraseId===draft.id);
      fbContainer.hidden = !fbOpen;
      fbToggleBtn.textContent = fbOpen ? '閉じる' : '運指';
      if (fbOpen) renderFingeringEditArea(fbContainer, draft.id);

      fbToggleBtn.addEventListener('click', function(){
        fbOpen = !fbOpen;
        fbContainer.hidden = !fbOpen;
        fbToggleBtn.textContent = fbOpen ? '閉じる' : '運指';
        if (fbOpen) renderFingeringEditArea(fbContainer, draft.id);
      });

      var fbRow = makeEl('div','approach-toggle-row');
      fbRow.appendChild(fbToggleBtn);
      body.appendChild(fbRow);
      body.appendChild(fbContainer);
    }

    // 保存 / キャンセル
    var actions = makeEl('div','expanded-actions');
    var cancelBtn = makeEl('button','btn btn-secondary','キャンセル');
    cancelBtn.addEventListener('click', function(){
      ui.fingeringSession = null;
      if (isNew){
        ui.expandedId = null; ui.mode = null; ui.draft = null;
      } else {
        ui.mode = 'view'; ui.draft = null;
      }
      renderPhraseList();
    });
    var saveBtn = makeEl('button','btn btn-primary','保存');
    saveBtn.addEventListener('click', function(){ saveDraft(); });
    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    body.appendChild(actions);

    row.appendChild(body);

    if (isNew){
      setTimeout(function(){ nameInput.focus(); }, 0);
    }
    return row;
  }

  function saveDraft(){
    var d = ui.draft;
    if (!d.name || !d.name.trim()){
      showConfirm('フレーズ名を入力してください。', null, {alertOnly:true});
      return;
    }
    if (d.main.some(function(v){ return !v; })){
      showConfirm('メインフレーズの4音をすべて選んでください。', null, {alertOnly:true});
      return;
    }
    if (d.approach && d.approach.some(function(v){ return !v; })){
      showConfirm('アプローチフレーズを追加した場合は4音すべて選んでください。不要なら削除してください。', null, {alertOnly:true});
      return;
    }
    d.name = d.name.trim();
    if (d.id){
      var target = state.phrases.find(function(p){ return p.id===d.id; });
      if (target){
        target.name = d.name;
        target.category = d.category;
        target.main = d.main.map(cloneNote);
        target.approach = d.approach ? d.approach.map(cloneNote) : null;
      }
      ui.expandedId = d.id; ui.mode = 'view'; ui.draft = null;
    } else {
      state.phrases.push({
        id: uid(),
        name: d.name,
        category: d.category,
        main: d.main.map(cloneNote),
        approach: d.approach ? d.approach.map(cloneNote) : null,
        fingerings: [],
        createdAt: Date.now()
      });
      ui.expandedId = null; ui.mode = null; ui.draft = null;
    }
    saveState();
    renderFilterSelect();
    renderPhraseList();
  }

  /* =========================================================
     指板図の描画
  ========================================================= */
  function buildFretboardDiagramHTML(positions, seq){
    var placedFrets = positions.filter(Boolean).map(function(p){ return p.fret; });
    var minF = placedFrets.length ? Math.min.apply(null, placedFrets) : 0;
    var maxF = placedFrets.length ? Math.max.apply(null, placedFrets) : 4;
    var loFret = Math.max(0, minF-1);
    var hiFret = Math.max(maxF+1, loFret+4);

    var cellW = 42, leftPad = 30, topPad = 12, rowH = 24;
    var fretCount = hiFret - loFret + 1;
    var svgW = leftPad + fretCount*cellW + 10;
    var svgH = topPad + 5*rowH + 22;

    var svg = '<svg viewBox="0 0 '+svgW+' '+svgH+'" width="'+svgW+'" height="'+svgH+'" xmlns="http://www.w3.org/2000/svg">';
    for (var s=0; s<6; s++){
      var y = topPad + s*rowH;
      svg += '<line x1="'+leftPad+'" y1="'+y+'" x2="'+(svgW-8)+'" y2="'+y+'" stroke="#B5B5B9" stroke-width="1.5"/>';
    }
    for (var f=0; f<=fretCount; f++){
      var x = leftPad + f*cellW;
      var isNut = (loFret===0 && f===0);
      svg += '<line x1="'+x+'" y1="'+topPad+'" x2="'+x+'" y2="'+(topPad+5*rowH)+'" stroke="#948F84" stroke-width="'+(isNut?3:1)+'"/>';
    }
    svg += '<text x="'+(leftPad+cellW/2)+'" y="'+(topPad+5*rowH+17)+'" font-size="10" fill="#6B6B70" text-anchor="middle">'+loFret+'f</text>';

    positions.forEach(function(pos, i){
      if (!pos) return;
      var info = degreeInfo(seq[i].label);
      var cx = leftPad + (pos.fret-loFret+0.5)*cellW;
      var cy = topPad + pos.string*rowH;
      var fill = info.type==='tension' ? '#8C6410' : '#2F3C7E';
      svg += '<g class="fb-note" data-idx="'+i+'">';
      svg += '<circle cx="'+cx+'" cy="'+cy+'" r="10" fill="'+fill+'"/>';
      svg += '<text x="'+cx+'" y="'+(cy+3.5)+'" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">'+info.label+'</text>';
      svg += '<text x="'+cx+'" y="'+(cy-13)+'" font-size="8" fill="#948F84" text-anchor="middle">'+(i+1)+'</text>';
      svg += '</g>';
    });
    svg += '</svg>';
    return svg;
  }

  function nextFingeringName(fingerings){
    var maxN = 0;
    (fingerings||[]).forEach(function(f){
      var m = /^運指パターン(\d+)$/.exec(f.name||'');
      if (m){ var n = parseInt(m[1],10); if (n>maxN) maxN=n; }
    });
    return '運指パターン' + (maxN+1);
  }

  function startFingeringSession(phraseId, editingId){
    var phrase = state.phrases.find(function(x){ return x.id===phraseId; });
    if (!phrase) return;
    if (!phrase.fingerings) phrase.fingerings = [];
    var seq = buildFretSequence(phrase.approach, phrase.main);
    if (seq.length===0) return;
    var autoResults = fbGenerateAll(seq);
    var results = autoResults;
    var existingName = null;
    if (editingId){
      var existing = phrase.fingerings.find(function(f){ return f.id===editingId; });
      if (existing && existing.positions && existing.positions.length===seq.length){
        var savedEntry = {
          startString: null,
          positions: existing.positions.map(function(p){ return p ? {string:p.string, fret:p.fret} : null; }),
          score: fbScore(existing.positions)
        };
        var combined = [savedEntry].concat(autoResults);
        var completeCombined = combined.filter(function(r){ return r.score.nullCount===0; });
        results = completeCombined.length>0 ? completeCombined : combined;
        results.sort(function(a,b){
          if (a.score.nullCount!==b.score.nullCount) return a.score.nullCount-b.score.nullCount;
          return a.score.span-b.score.span;
        });
        existingName = existing.name;
      }
    }
    ui.fingeringSession = {
      phraseId: phraseId,
      editingId: editingId || null,
      seq: seq,
      results: results,
      index: 0,
      name: existingName || nextFingeringName(phrase.fingerings)
    };
  }

  function renderFingeringSessionArea(container, phraseId){
    var session = ui.fingeringSession;
    var wrap = makeEl('div','fingering-session');
    var current = session.results[session.index];
    var positions = current.positions;

    var diagramWrap = makeEl('div','fretboard-diagram');
    diagramWrap.innerHTML = buildFretboardDiagramHTML(positions, session.seq);
    diagramWrap.addEventListener('click', function(e){
      var g = e.target.closest ? e.target.closest('.fb-note') : null;
      if (!g) return;
      var idx = parseInt(g.getAttribute('data-idx'), 10);
      openFretPicker(idx, session.seq, function(newPos){
        positions[idx] = newPos;
        renderFingeringEditArea(container, phraseId);
      });
    });
    wrap.appendChild(diagramWrap);

    var unplacedCount = positions.filter(function(p){ return !p; }).length;
    if (unplacedCount>0){
      var list = makeEl('div','fb-unplaced-list');
      positions.forEach(function(pos, i){
        if (pos) return;
        var row = makeEl('div','fb-unplaced-row');
        row.appendChild(makeEl('span', null, (i+1)+'番目「'+session.seq[i].label+'」が見つかりません'));
        var fixBtn = makeEl('button','btn-ghost','選ぶ');
        fixBtn.addEventListener('click', function(){
          openFretPicker(i, session.seq, function(newPos){
            positions[i] = newPos;
            renderFingeringEditArea(container, phraseId);
          });
        });
        row.appendChild(fixBtn);
        list.appendChild(row);
      });
      wrap.appendChild(list);
    }

    var regenBtn = makeEl('button','btn btn-secondary btn-block','別の運指を生成');
    regenBtn.style.marginTop = '10px';
    regenBtn.addEventListener('click', function(){
      session.index = (session.index+1) % session.results.length;
      renderFingeringEditArea(container, phraseId);
    });
    wrap.appendChild(regenBtn);

    var nameField = makeEl('div','field');
    nameField.style.marginTop = '14px';
    nameField.appendChild(makeEl('label','field-label','パターン名'));
    var nameInput = document.createElement('input');
    nameInput.className = 'input';
    nameInput.value = session.name;
    nameInput.addEventListener('input', function(e){ session.name = e.target.value; });
    nameField.appendChild(nameInput);
    wrap.appendChild(nameField);

    var saveRow = makeEl('div','expanded-actions');
    var cancelBtn = makeEl('button','btn btn-secondary','キャンセル');
    cancelBtn.addEventListener('click', function(){
      ui.fingeringSession = null;
      renderFingeringEditArea(container, phraseId);
    });
    saveRow.appendChild(cancelBtn);

    if (session.editingId){
      var overwriteBtn = makeEl('button','btn btn-secondary','上書き保存');
      overwriteBtn.addEventListener('click', function(){
        var phrase = state.phrases.find(function(x){ return x.id===phraseId; });
        var fg = phrase && (phrase.fingerings||[]).find(function(x){ return x.id===session.editingId; });
        if (fg){
          fg.name = (session.name||'').trim() || fg.name;
          fg.positions = positions.map(function(p){ return p ? {string:p.string, fret:p.fret} : null; });
          saveState();
        }
        ui.fingeringSession = null;
        renderFingeringEditArea(container, phraseId);
      });
      saveRow.appendChild(overwriteBtn);
    }

    var saveAsBtn = makeEl('button','btn btn-primary','別名で保存');
    saveAsBtn.addEventListener('click', function(){
      var phrase = state.phrases.find(function(x){ return x.id===phraseId; });
      if (!phrase) return;
      if (!phrase.fingerings) phrase.fingerings = [];
      var name = (session.name||'').trim() || nextFingeringName(phrase.fingerings);
      phrase.fingerings.push({
        id: uid(),
        name: name,
        positions: positions.map(function(p){ return p ? {string:p.string, fret:p.fret} : null; })
      });
      saveState();
      ui.fingeringSession = null;
      renderFingeringEditArea(container, phraseId);
    });
    saveRow.appendChild(saveAsBtn);

    wrap.appendChild(saveRow);
    return wrap;
  }

  function renderFingeringEditArea(container, phraseId){
    clear(container);
    var phrase = state.phrases.find(function(x){ return x.id===phraseId; });
    if (!phrase) return;
    if (!phrase.fingerings) phrase.fingerings = [];

    container.appendChild(makeEl('div','section-label','運指パターン'));

    if (phrase.fingerings.length===0){
      container.appendChild(makeEl('div','empty-state','保存された運指パターンはまだありません。'));
    } else {
      phrase.fingerings.forEach(function(fg){
        var row = makeEl('div','category-row');
        row.appendChild(makeEl('span','cat-name', fg.name));
        var editFgBtn = makeEl('button','icon-btn');
        editFgBtn.title = '編集';
        editFgBtn.innerHTML = ICON_EDIT;
        editFgBtn.addEventListener('click', function(){
          startFingeringSession(phraseId, fg.id);
          renderFingeringEditArea(container, phraseId);
        });
        var delFgBtn = makeEl('button','icon-btn');
        delFgBtn.title = '削除';
        delFgBtn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
        delFgBtn.addEventListener('click', function(){
          showConfirm('「'+fg.name+'」を削除しますか？', function(){
            phrase.fingerings = phrase.fingerings.filter(function(x){ return x.id!==fg.id; });
            if (ui.fingeringSession && ui.fingeringSession.editingId===fg.id){ ui.fingeringSession = null; }
            saveState();
            renderFingeringEditArea(container, phraseId);
          });
        });
        row.appendChild(editFgBtn);
        row.appendChild(delFgBtn);
        container.appendChild(row);
      });
    }

    var activeSession = ui.fingeringSession && ui.fingeringSession.phraseId===phraseId;
    if (!activeSession){
      var newBtn = makeEl('button','btn btn-secondary btn-block','＋ 新しい運指を作る');
      newBtn.style.marginTop = '10px';
      newBtn.addEventListener('click', function(){
        startFingeringSession(phraseId, null);
        renderFingeringEditArea(container, phraseId);
      });
      container.appendChild(newBtn);
    } else {
      container.appendChild(renderFingeringSessionArea(container, phraseId));
    }
  }

  function goEditFingering(phraseId, fingeringIdOrNew){
    var p = state.phrases.find(function(x){ return x.id===phraseId; });
    if (!p) return;
    ui.draft = {
      id:p.id, name:p.name, category:p.category,
      main: p.main.map(cloneNote),
      approach: p.approach ? p.approach.map(cloneNote) : null
    };
    ui.mode = 'edit';
    startFingeringSession(phraseId, fingeringIdOrNew==='new' ? null : fingeringIdOrNew);
    renderPhraseList();
  }

  function buildFingeringViewBlock(p){
    var toggleBtn = makeEl('button','btn btn-secondary','運指');
    var section = makeEl('div','fretboard-section');
    section.hidden = true;
    var localIndex = 0;

    function render(){
      clear(section);
      var list = p.fingerings || [];
      if (list.length===0){
        section.appendChild(makeEl('div','empty-state','保存された運指パターンはまだありません。'));
        var createBtn = makeEl('button','btn btn-secondary btn-block','編集画面で作る');
        createBtn.style.marginTop = '10px';
        createBtn.addEventListener('click', function(e){
          e.stopPropagation();
          goEditFingering(p.id, 'new');
        });
        section.appendChild(createBtn);
        return;
      }
      if (localIndex>=list.length) localIndex = 0;
      var fg = list[localIndex];
      var seq = buildFretSequence(p.approach, p.main);

      if (list.length>1){
        var switcher = makeEl('div','fb-pattern-switcher');
        list.forEach(function(item, i){
          var b = makeEl('button', 'fb-pattern-btn' + (i===localIndex ? ' active' : ''), item.name);
          b.addEventListener('click', function(e){
            e.stopPropagation();
            localIndex = i;
            render();
          });
          switcher.appendChild(b);
        });
        section.appendChild(switcher);
      }

      if (fg.positions.length!==seq.length){
        section.appendChild(makeEl('div','empty-state','このパターンはフレーズの内容と合わなくなっています。'));
      } else {
        var diagramWrap = makeEl('div','fretboard-diagram');
        diagramWrap.innerHTML = buildFretboardDiagramHTML(fg.positions, seq);
        section.appendChild(diagramWrap);
      }

      var editFgBtn = makeEl('button','btn btn-secondary btn-block','編集する');
      editFgBtn.style.marginTop = '10px';
      editFgBtn.addEventListener('click', function(e){
        e.stopPropagation();
        goEditFingering(p.id, fg.id);
      });
      section.appendChild(editFgBtn);
    }

    toggleBtn.addEventListener('click', function(e){
      e.stopPropagation();
      var opening = section.hidden;
      section.hidden = !opening;
      toggleBtn.textContent = opening ? '閉じる' : '運指';
      if (opening) render();
    });

    return {button: toggleBtn, section: section};
  }

  function renderCategoryPanel(){

    if (state.categories.length===0){
      listEl.appendChild(makeEl('div','empty-state','カテゴリがまだありません。下から追加してください。'));
      return;
    }
    state.categories.forEach(function(name){
      var row = makeEl('div','category-row');
      var nameSpan = makeEl('span','cat-name', name);

      if (name==='未分類'){
        var exportOnlyBtn = makeEl('button','icon-btn');
        exportOnlyBtn.title = '書き出し';
        exportOnlyBtn.innerHTML = ICON_DOWNLOAD;
        exportOnlyBtn.addEventListener('click', function(){ exportCategoryData(name); });
        row.appendChild(nameSpan);
        row.appendChild(exportOnlyBtn);
        listEl.appendChild(row);
        return;
      }

      var editInput = document.createElement('input');
      editInput.className = 'cat-edit-input input';
      editInput.value = name;

      var abbrValue = state.categoryAbbr[name] || '';
      var abbrBadge = makeEl('span', 'cat-abbr-badge' + (abbrValue ? '' : ' empty'), abbrValue || '省略名なし');
      var abbrInput = document.createElement('input');
      abbrInput.className = 'cat-abbr-input input';
      abbrInput.placeholder = '省略名';
      abbrInput.maxLength = 4;
      abbrInput.value = abbrValue;

      var editBtn = makeEl('button','icon-btn edit-icon-btn');
      editBtn.title = '編集';
      editBtn.innerHTML = ICON_EDIT;

      var catExportBtn = makeEl('button','icon-btn');
      catExportBtn.title = '書き出し';
      catExportBtn.innerHTML = ICON_DOWNLOAD;
      catExportBtn.addEventListener('click', function(){ exportCategoryData(name); });

      var delBtn = makeEl('button','icon-btn');
      delBtn.title = '削除';
      delBtn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

      editBtn.addEventListener('click', function(){
        if (row.classList.contains('editing')){
          var newName = editInput.value.trim();
          var newAbbr = abbrInput.value.trim();
          if (!newAbbr){
            showConfirm('省略名を入力してください。', null, {alertOnly:true});
            return;
          }
          var finalName = (newName && newName!==name) ? newName : name;
          if (findCategoryWithAbbr(newAbbr, name)){
            showConfirm('この省略名は「'+findCategoryWithAbbr(newAbbr,name)+'」ですでに使われています。', null, {alertOnly:true});
            return;
          }
          if (finalName!==name){
            renameCategory(name, finalName);
          }
          state.categoryAbbr[finalName] = newAbbr;
          saveState();
          renderCategoryPanel();
        } else {
          document.querySelectorAll('.category-row.editing').forEach(function(r){
            r.classList.remove('editing');
            var otherBtn = r.querySelector('.edit-icon-btn');
            if (otherBtn){ otherBtn.innerHTML = ICON_EDIT; otherBtn.title = '編集'; }
          });
          row.classList.add('editing');
          editBtn.innerHTML = ICON_CONFIRM;
          editBtn.title = '確定';
          editInput.value = name;
          abbrInput.value = abbrValue;
          editInput.focus();
        }
      });
      editInput.addEventListener('keydown', function(e){
        if (e.key==='Enter' && !e.isComposing && e.keyCode!==229){ editBtn.click(); }
      });
      abbrInput.addEventListener('keydown', function(e){
        if (e.key==='Enter' && !e.isComposing && e.keyCode!==229){ editBtn.click(); }
      });

      delBtn.addEventListener('click', function(){
        var used = state.phrases.filter(function(p){ return p.category===name; }).length;
        var msg = used>0
          ? ('「'+name+'」を削除しますか？このカテゴリを使っている'+used+'件のフレーズは「未分類」に移動します。')
          : ('「'+name+'」を削除しますか？');
        showConfirm(msg, function(){ deleteCategory(name); });
      });

      row.appendChild(nameSpan);
      row.appendChild(abbrBadge);
      row.appendChild(editInput);
      row.appendChild(abbrInput);
      row.appendChild(editBtn);
      row.appendChild(catExportBtn);
      row.appendChild(delBtn);
      listEl.appendChild(row);
    });
  }

  function renameCategory(oldName, newName){
    if (state.categories.indexOf(newName)!==-1 && newName!==oldName){
      showConfirm('同じ名前のカテゴリが既にあります。', null, {alertOnly:true});
      return;
    }
    var idx = state.categories.indexOf(oldName);
    if (idx!==-1) state.categories[idx] = newName;
    if (state.categoryAbbr[oldName]!==undefined){
      state.categoryAbbr[newName] = state.categoryAbbr[oldName];
      delete state.categoryAbbr[oldName];
    }
    ensureUncategorizedLast();
    state.phrases.forEach(function(p){ if (p.category===oldName) p.category = newName; });
    if (ui.filterCategory===oldName) ui.filterCategory = newName;
    if (ui.draft && ui.draft.category===oldName) ui.draft.category = newName;
    saveState();
    renderCategoryPanel();
    renderFilterSelect();
    renderPhraseList();
  }

  function deleteCategory(name){
    state.categories = state.categories.filter(function(c){ return c!==name; });
    delete state.categoryAbbr[name];
    if (state.categories.indexOf('未分類')===-1){ state.categories.push('未分類'); }
    ensureUncategorizedLast();
    var fallback = '未分類';
    state.phrases.forEach(function(p){ if (p.category===name) p.category = fallback; });
    if (ui.filterCategory===name) ui.filterCategory = 'ALL';
    if (ui.draft && ui.draft.category===name) ui.draft.category = fallback;
    saveState();
    renderCategoryPanel();
    renderFilterSelect();
    renderPhraseList();
  }

  document.getElementById('add-category-btn').addEventListener('click', function(){
    var input = document.getElementById('new-category-input');
    var abbrInput = document.getElementById('new-category-abbr-input');
    var name = input.value.trim();
    var abbr = abbrInput.value.trim();
    if (!name) return;
    if (!abbr){
      showConfirm('省略名を入力してください。', null, {alertOnly:true});
      return;
    }
    if (state.categories.indexOf(name)!==-1){
      showConfirm('同じ名前のカテゴリが既にあります。', null, {alertOnly:true});
      return;
    }
    var conflict = findCategoryWithAbbr(abbr, null);
    if (conflict){
      showConfirm('この省略名は「'+conflict+'」ですでに使われています。', null, {alertOnly:true});
      return;
    }
    state.categories.push(name);
    state.categoryAbbr[name] = abbr;
    ensureUncategorizedLast();
    input.value = '';
    abbrInput.value = '';
    saveState();
    renderCategoryPanel();
    renderFilterSelect();
  });
  document.getElementById('new-category-abbr-input').addEventListener('keydown', function(e){
    if (e.key==='Enter' && !e.isComposing && e.keyCode!==229){
      document.getElementById('add-category-btn').click();
    }
  });
  document.getElementById('new-category-input').addEventListener('keydown', function(e){
    if (e.key==='Enter' && !e.isComposing && e.keyCode!==229){
      document.getElementById('add-category-btn').click();
    }
  });

  /* =========================================================
     画面切り替え（一覧タブ／連結タブ／設定ページ）
  ========================================================= */
  var homeView = document.getElementById('home-view');
  var linksView = document.getElementById('links-view');
  var settingsView = document.getElementById('settings-view');
  var settingsToggleBtn = document.getElementById('settings-toggle');
  var headerTitleEl = document.getElementById('header-title');
  var fabBtn = document.getElementById('add-fab');
  var tabbarEl = document.getElementById('tabbar');
  var settingsOpen = false;
  var currentTab = 'list';

  function updateMainView(){
    homeView.hidden = settingsOpen || currentTab!=='list';
    linksView.hidden = settingsOpen || currentTab!=='links';
    settingsView.hidden = !settingsOpen;
    tabbarEl.hidden = settingsOpen;
    fabBtn.style.display = (settingsOpen || currentTab!=='list') ? 'none' : '';

    if (settingsOpen){
      headerTitleEl.textContent = '設定';
      document.getElementById('header-count').textContent = '';
    } else if (currentTab==='links'){
      headerTitleEl.textContent = '連結';
      document.getElementById('header-count').textContent = state.links.length + '件';
    } else {
      headerTitleEl.textContent = 'フレーズ一覧';
      renderHeaderCount();
    }
  }

  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentTab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b===btn); });
      updateMainView();
      if (currentTab==='links') renderLinksView();
    });
  });

  settingsToggleBtn.addEventListener('click', function(){
    settingsOpen = !settingsOpen;
    settingsToggleBtn.classList.toggle('active', settingsOpen);
    settingsToggleBtn.innerHTML = settingsOpen ? ICON_TOGGLE_CLOSE : ICON_SETTINGS;
    settingsToggleBtn.title = settingsOpen ? '閉じる' : '設定';
    updateMainView();
  });

  document.getElementById('reload-btn').addEventListener('click', function(){
    window.location.href = window.location.pathname + '?_=' + Date.now();
  });

  function sanitizeFilename(s){
    return (s || '').replace(/[\\/:*?"<>|]/g, '_').slice(0, 40);
  }

  function downloadJSON(filename, obj){
    var blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function exportBase(scope){
    return { app:'phrase-stock', version:1, scope:scope, exportedAt:new Date().toISOString() };
  }

  function exportAllData(){
    var payload = exportBase('all');
    payload.categories = state.categories;
    payload.categoryAbbr = state.categoryAbbr;
    payload.phrases = state.phrases;
    payload.links = state.links;
    downloadJSON('phrase-stock-all-' + Date.now() + '.json', payload);
  }

  function exportCategoryData(name){
    var payload = exportBase('category');
    payload.category = name;
    payload.categoryAbbr = state.categoryAbbr[name] || null;
    payload.phrases = state.phrases.filter(function(p){ return p.category===name; });
    downloadJSON('phrase-stock-' + sanitizeFilename(name) + '-' + Date.now() + '.json', payload);
  }

  function exportPhraseData(phrase){
    var payload = exportBase('phrase');
    payload.phrase = phrase;
    downloadJSON('phrase-stock-' + sanitizeFilename(phrase.name || 'phrase') + '-' + Date.now() + '.json', payload);
  }

  document.getElementById('export-all-btn').addEventListener('click', exportAllData);

  document.getElementById('import-btn').addEventListener('click', function(){
    document.getElementById('import-file-input').click();
  });
  document.getElementById('import-file-input').addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var data;
      try{ data = JSON.parse(ev.target.result); }
      catch(err){
        showConfirm('ファイルを読み込めませんでした。書き出したファイルか確認してください。', null, {alertOnly:true});
        return;
      }
      importPayload(data);
    };
    reader.readAsText(file);
  });

  function importEnsureCategory(name){
    if (name && state.categories.indexOf(name)===-1){
      state.categories.push(name);
    }
  }
  function importAddPhrase(p){
    if (!p || !p.name || !p.main) return null;
    importEnsureCategory(p.category);
    var category = (p.category && state.categories.indexOf(p.category)!==-1) ? p.category : '未分類';
    var fingerings = [];
    if (Array.isArray(p.fingerings)){
      p.fingerings.forEach(function(fg){
        if (!fg || !Array.isArray(fg.positions)) return;
        fingerings.push({
          id: uid(),
          name: fg.name || '運指パターン',
          positions: fg.positions.map(function(pos){
            return (pos && typeof pos.string==='number' && typeof pos.fret==='number')
              ? {string:pos.string, fret:pos.fret} : null;
          })
        });
      });
    }
    var newId = uid();
    state.phrases.push({
      id: newId,
      name: p.name,
      category: category,
      main: (p.main || []).map(cloneNote),
      approach: p.approach ? p.approach.map(cloneNote) : null,
      fingerings: fingerings,
      createdAt: Date.now()
    });
    return newId;
  }
  function importSetCategoryAbbr(name, abbr){
    if (!name || !abbr) return;
    if (state.categoryAbbr[name]) return;
    var used = Object.keys(state.categoryAbbr).some(function(k){ return state.categoryAbbr[k]===abbr; });
    if (used) return;
    state.categoryAbbr[name] = abbr;
  }

  function importPayload(data){
    if (!data || data.app!=='phrase-stock' || !data.scope){
      showConfirm('このファイルは読み込めません。', null, {alertOnly:true});
      return;
    }
    var count = 0;
    var idMap = {};
    if (data.scope==='all'){
      (data.categories || []).forEach(importEnsureCategory);
      if (data.categoryAbbr){
        Object.keys(data.categoryAbbr).forEach(function(catName){
          importSetCategoryAbbr(catName, data.categoryAbbr[catName]);
        });
      }
      (data.phrases || []).forEach(function(p){
        var newId = importAddPhrase(p);
        if (newId){ count++; if (p.id) idMap[p.id] = newId; }
      });
      (data.links || []).forEach(function(link){
        if (!link || !Array.isArray(link.phraseIds)) return;
        var mappedIds = link.phraseIds.map(function(oldId){ return idMap[oldId]; }).filter(Boolean);
        if (mappedIds.length===0) return;
        state.links.push({ id:uid(), name: link.name || '連結', phraseIds: mappedIds, createdAt: Date.now() });
      });
    } else if (data.scope==='category'){
      importEnsureCategory(data.category);
      if (data.categoryAbbr) importSetCategoryAbbr(data.category, data.categoryAbbr);
      (data.phrases || []).forEach(function(p){ if (importAddPhrase(p)) count++; });
    } else if (data.scope==='phrase'){
      if (importAddPhrase(data.phrase)) count++;
    } else {
      showConfirm('このファイルは読み込めません。', null, {alertOnly:true});
      return;
    }
    ensureUncategorizedLast();
    saveState();
    renderFilterSelect();
    renderPhraseList();
    if (ui.categoryPanelOpen) renderCategoryPanel();
    showConfirm(count + '件のフレーズを読み込みました。', null, {alertOnly:true});
  }

  /* =========================================================
     連結（複数フレーズをつなげて表示・保存）
  ========================================================= */
  function renderLinksView(){
    var container = document.getElementById('links-view-content');
    if (!container) return;
    if (ui.linksSubView==='create') renderLinksEditor(container);
    else if (ui.linksSubView==='detail') renderLinksDetail(container);
    else renderLinksList(container);
  }

  function renderLinksList(container){
    clear(container);
    if (state.links.length===0){
      container.appendChild(makeEl('div','empty-state','保存された連結はまだありません。下の「＋ 新しい連結を作る」から作成してください。'));
    } else {
      state.links.slice().sort(function(a,b){ return b.createdAt-a.createdAt; }).forEach(function(link){
        var row = makeEl('div','phrase-row');
        var head = makeEl('div','phrase-row-head');
        head.appendChild(makeEl('span', link.name ? 'name' : 'name placeholder', link.name || '(名称未設定)'));
        head.appendChild(makeEl('span','chevron','›'));
        head.addEventListener('click', function(){
          ui.linksSubView = 'detail';
          ui.linksActiveId = link.id;
          ui.linksDetailExpanded = null;
          renderLinksView();
        });
        row.appendChild(head);
        container.appendChild(row);
      });
    }
    var newBtn = makeEl('button','btn btn-primary btn-block','＋ 新しい連結を作る');
    newBtn.style.marginTop = '14px';
    newBtn.addEventListener('click', function(){
      ui.linksSubView = 'create';
      ui.linksActiveId = null;
      ui.linksDraft = { id:null, name:'', phraseIds:[] };
      renderLinksView();
    });
    container.appendChild(newBtn);
  }

  function renderLinksEditor(container){
    clear(container);
    var draft = ui.linksDraft;

    var nameField = makeEl('div','field');
    nameField.appendChild(makeEl('label','field-label','連結名'));
    var nameInput = document.createElement('input');
    nameInput.className = 'input';
    nameInput.value = draft.name || '';
    nameInput.addEventListener('input', function(e){ draft.name = e.target.value; });
    nameField.appendChild(nameInput);
    container.appendChild(nameField);

    container.appendChild(makeEl('div','section-label','選択したフレーズ'));
    if (draft.phraseIds.length===0){
      container.appendChild(makeEl('div','empty-state','下の一覧からフレーズを追加してください。'));
    } else {
      draft.phraseIds.forEach(function(pid, idx){
        var phrase = state.phrases.find(function(p){ return p.id===pid; });
        var row = makeEl('div','link-selected-row');
        var label = phrase ? (getPhraseNumberLabel(phrase)||'?') + '　' + phrase.name : '(削除されたフレーズ)';
        row.appendChild(makeEl('span', null, label));
        var btnGroup = makeEl('div','link-selected-actions');
        if (idx>0){
          var upBtn = makeEl('button','icon-btn','↑');
          upBtn.addEventListener('click', function(){
            var tmp = draft.phraseIds[idx-1];
            draft.phraseIds[idx-1] = draft.phraseIds[idx];
            draft.phraseIds[idx] = tmp;
            renderLinksView();
          });
          btnGroup.appendChild(upBtn);
        }
        if (idx<draft.phraseIds.length-1){
          var downBtn = makeEl('button','icon-btn','↓');
          downBtn.addEventListener('click', function(){
            var tmp = draft.phraseIds[idx+1];
            draft.phraseIds[idx+1] = draft.phraseIds[idx];
            draft.phraseIds[idx] = tmp;
            renderLinksView();
          });
          btnGroup.appendChild(downBtn);
        }
        var rmBtn = makeEl('button','icon-btn','×');
        rmBtn.addEventListener('click', function(){
          draft.phraseIds.splice(idx,1);
          renderLinksView();
        });
        btnGroup.appendChild(rmBtn);
        row.appendChild(btnGroup);
        container.appendChild(row);
      });
    }

    container.appendChild(makeEl('div','section-label','フレーズを追加'));
    var eligible = eligiblePhrasesForLink();
    if (eligible.length===0){
      container.appendChild(makeEl('div','empty-state','番号が振れるフレーズがありません。カテゴリに省略名を設定してください。'));
    } else {
      eligible
        .sort(function(a,b){ return (getPhraseNumberLabel(a)||'').localeCompare(getPhraseNumberLabel(b)||''); })
        .forEach(function(p){
          var row = makeEl('div','link-add-row');
          row.appendChild(makeEl('span', null, getPhraseNumberLabel(p) + '　' + p.name));
          var addBtn = makeEl('button','btn-ghost','追加');
          addBtn.addEventListener('click', function(){
            draft.phraseIds.push(p.id);
            renderLinksView();
          });
          row.appendChild(addBtn);
          container.appendChild(row);
        });
    }

    var actions = makeEl('div','expanded-actions');
    var cancelBtn = makeEl('button','btn btn-secondary','キャンセル');
    cancelBtn.addEventListener('click', function(){
      ui.linksSubView = 'list';
      ui.linksDraft = null;
      renderLinksView();
    });
    var saveBtn = makeEl('button','btn btn-primary','保存');
    saveBtn.addEventListener('click', function(){
      if (!draft.name || !draft.name.trim()){
        showConfirm('連結名を入力してください。', null, {alertOnly:true});
        return;
      }
      if (draft.phraseIds.length===0){
        showConfirm('フレーズを1つ以上追加してください。', null, {alertOnly:true});
        return;
      }
      if (draft.id){
        var target = state.links.find(function(l){ return l.id===draft.id; });
        if (target){ target.name = draft.name.trim(); target.phraseIds = draft.phraseIds.slice(); }
      } else {
        state.links.push({ id:uid(), name:draft.name.trim(), phraseIds:draft.phraseIds.slice(), createdAt:Date.now() });
      }
      saveState();
      ui.linksSubView = 'list';
      ui.linksDraft = null;
      updateMainView();
      renderLinksView();
    });
    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    container.appendChild(actions);
  }

  function renderLinksDetail(container){
    clear(container);
    var link = state.links.find(function(l){ return l.id===ui.linksActiveId; });
    if (!link){
      ui.linksSubView = 'list';
      renderLinksView();
      return;
    }

    container.appendChild(makeEl('div','section-label', link.name));

    var badgeRow = makeEl('div','link-badge-row');
    link.phraseIds.forEach(function(pid, idx){
      var phrase = state.phrases.find(function(p){ return p.id===pid; });
      var badge = makeEl('button','link-badge', phrase ? (getPhraseNumberLabel(phrase)||'?') : '×');
      if (!phrase) badge.classList.add('missing');
      badge.addEventListener('click', function(){
        ui.linksDetailExpanded = (ui.linksDetailExpanded===idx) ? null : idx;
        renderLinksView();
      });
      badgeRow.appendChild(badge);
    });
    container.appendChild(badgeRow);

    if (ui.linksDetailExpanded!==null){
      var idx = ui.linksDetailExpanded;
      var pid = link.phraseIds[idx];
      var phrase = state.phrases.find(function(p){ return p.id===pid; });
      var detailBox = makeEl('div','link-detail-box');
      if (!phrase){
        detailBox.appendChild(makeEl('div','empty-state','このフレーズは削除されました。'));
      } else {
        detailBox.appendChild(makeEl('div','degree-line-title', phrase.name));
        detailBox.appendChild(buildGrid(phrase.approach, phrase.main, false));
        detailBox.appendChild(degreeLineNode(phrase.approach, phrase.main));
      }
      container.appendChild(detailBox);
    }

    var actions = makeEl('div','expanded-actions');
    var backBtn = makeEl('button','btn-ghost','一覧に戻る');
    backBtn.addEventListener('click', function(){
      ui.linksSubView = 'list';
      renderLinksView();
    });
    var editLinkBtn = makeEl('button','btn-ghost','編集');
    editLinkBtn.addEventListener('click', function(){
      ui.linksDraft = { id:link.id, name:link.name, phraseIds:link.phraseIds.slice() };
      ui.linksSubView = 'create';
      renderLinksView();
    });
    var delLinkBtn = makeEl('button','btn-danger-ghost','削除');
    delLinkBtn.addEventListener('click', function(){
      showConfirm('「'+link.name+'」を削除しますか？', function(){
        state.links = state.links.filter(function(l){ return l.id!==link.id; });
        saveState();
        ui.linksSubView = 'list';
        updateMainView();
        renderLinksView();
      });
    });
    actions.appendChild(backBtn);
    actions.appendChild(editLinkBtn);
    actions.appendChild(delLinkBtn);
    container.appendChild(actions);
  }

  /* =========================================================
     確認モーダル（共通）
  ========================================================= */
  var confirmOverlay = document.getElementById('confirm-overlay');
  var confirmMessage = document.getElementById('confirm-message');
  var confirmOkBtn = document.getElementById('confirm-ok-btn');
  var confirmCancelBtn = document.getElementById('confirm-cancel-btn');
  var confirmCallback = null;

  function showConfirm(message, onConfirm, opts){
    opts = opts || {};
    confirmMessage.textContent = message;
    confirmCallback = onConfirm;
    if (opts.alertOnly){
      confirmOkBtn.style.display = 'none';
      confirmCancelBtn.textContent = '閉じる';
    } else {
      confirmOkBtn.style.display = 'inline-flex';
      confirmCancelBtn.textContent = 'キャンセル';
    }
    confirmOverlay.classList.add('show');
  }
  function hideConfirm(){
    confirmOverlay.classList.remove('show');
    confirmCallback = null;
  }
  confirmOkBtn.addEventListener('click', function(){
    var cb = confirmCallback;
    hideConfirm();
    if (cb) cb();
  });
  confirmCancelBtn.addEventListener('click', hideConfirm);
  confirmOverlay.addEventListener('click', function(e){ if (e.target===confirmOverlay) hideConfirm(); });

  /* =========================================================
     初期化
  ========================================================= */
  renderFilterSelect();
  renderPhraseList();
})();
</script>
